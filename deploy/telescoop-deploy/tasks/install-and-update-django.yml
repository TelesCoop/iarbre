- name: Install supervisor package
  apt:
    name:
      - supervisor

- name: Install {{ project_slug }}-ctl
  template:
    src: django-ctl.j2
    dest: "/usr/local/bin/{{ project_slug }}-ctl"
    mode: "0755"

- name: Create django settings to {{ django_settings_path }}
  template:
    src: "{{ template_django_settings_name|default('settings.ini.j2')}}"
    dest: "{{ django_settings_path }}"
    owner: "{{ main_user }}"
    group: devops
    mode: 0660

- name: Copy supervisord config to {{ supervisor_conf }}/{{ project_slug }}_backend.conf
  template:
    src: django-supervisor.conf.j2
    dest: "{{ supervisor_conf }}/{{ project_slug }}_backend.conf"
    owner: root
    group: root
    mode: 0644

- name: Install {{ project_slug }}-backend supervisor
  supervisorctl:
    name: "{{ project_slug }}-backend"
    state: present

- name: Copy supervisord GIS server config to {{ supervisor_conf }}/{{ project_slug }}_backend_gisserver.conf
  template:
    src: django-supervisor-gisserver.conf.j2
    dest: "{{ supervisor_conf }}/{{ project_slug }}_backend_gisserver.conf"
    owner: root
    group: root
    mode: 0644

- name: Reload supervisord config
  command: supervisorctl reread

- name: Update supervisord processes
  command: supervisorctl update

- name: Install {{ project_slug }}-backend-gisserver supervisor
  supervisorctl:
    name: "{{ project_slug }}-backend-gisserver"
    state: present

- name: Run migrations with conflict handling
  shell: |
    {{ project_slug }}-ctl migrate || {
      echo "Migration failed, trying fake-initial"
      {{ project_slug }}-ctl migrate --fake-initial
      {{ project_slug }}-ctl migrate
    }
  become: true
  when: dedicated_database == true and (clonecode.changed or force_update is defined)

- name: Collect backend static files
  ansible.builtin.command:
    cmd: "{{ project_slug }}-ctl collectstatic --no-input"
  when: clonecode.changed or force_update is defined

- name: Create media dir if not exist
  ansible.builtin.file:
    path: "{{ backend_media_path }}"
    state: directory
    owner: "{{ main_user }}"
    group: "{{ main_user }}"
    mode: 2755

- name: Restart {{ project_slug }} supervisor
  supervisorctl:
    name: "{{ project_slug }}-backend"
    state: restarted
  when: clonecode.changed or force_update is defined

- name: Restart {{ project_slug }}-backend-gisserver supervisor
  supervisorctl:
    name: "{{ project_slug }}-backend-gisserver"
    state: restarted
  when: clonecode.changed or force_update is defined

- name: Verify backend is running
  uri:
    url: "http://localhost:{{ backend_application_port }}/api/health-check/"
    status_code: 200
  retries: 5
  delay: 3

- name: Verify gisserver is running
  uri:
    url: "http://localhost:{{ gisserver_application_port }}/api/health-check/"
    status_code: 200
  retries: 5
  delay: 3
