---
- name: Setup and launch django backend
  hosts: all
  vars:
    django_path: "{{ project_dir }}/backend/back"
  handlers:
    - import_tasks: telescoop-deploy/handlers/nginx.yml
  tasks:
    - import_tasks: telescoop-deploy/tasks/create-https-certificate.yml
    - import_tasks: telescoop-deploy/tasks/setup-user-and-directories.yml
    - import_tasks: telescoop-deploy/tasks/setup-and-clone-git.yml
      vars:
        identity_file_path: "{{ backend_identity_file_path }}"
        repo: "{{ backend_repo }}"
        git_track_submodules: false
        clone_path: "{{ django_path }}/../"
        branch: "{{ backend_branch }}"
    - import_tasks: telescoop-deploy/tasks/install-python-venv.yml
      vars:
        requirements: "{{ django_path }}/requirements.txt"
    - name: Install Playwright system dependencies
      ansible.builtin.command:
        cmd: "{{ venv.path }}/bin/playwright install-deps chromium"
      become: true

    - name: Install Playwright Chromium for the app user
      ansible.builtin.command:
        cmd: "{{ venv.path }}/bin/playwright install chromium"
      become: true
      become_user: "{{ main_user }}"
    - name: Install and setup database for prod and preprod only
      block:
        - import_tasks: telescoop-deploy/tasks/install-database.yml
          vars:
            database_password: "{{ vault_database_password }}"
      when: dedicated_database
    - name: Use preprod media on feature branch by default
      block:
        - name: Remove existing media directory on feature branches
          file:
            path: "{{ backend_media_path }}"
            state: absent
        - name: Create symbolic link from feature media to preprod media
          file:
            src: "{{ project_base_dir }}_preprod/backend/back/media"
            dest: "{{ backend_media_path }}"
            state: link
      when: not dedicated_database
    - import_tasks: telescoop-deploy/tasks/install-and-update-django.yml
      vars:
        django_settings_path: /etc/{{ organization_slug }}/{{ project_slug }}/settings.ini
        django_workers: 5
        dedicated_database: "{{ branch is not defined }}"
        allow_backup: false
        database_password: "{{ vault_database_password }}"
        # If you use custom template, do not name it settings.j2
        template_django_settings_name: "settings-custom.ini.j2"

    - name: Use s3 backup if dedicated_database (by default on prod, preprod)
      block:
        - name: Delete MVT tiles before recovery
          shell:
            cmd: "{{ project_slug }}-ctl clean_mvt_files"

        - name: Check if .db_recover_target exists
          stat:
            path: "{{ django_path }}/.db_recover_target"
          register: db_recover_target_file

        - name: Read database version from .db_recover_target
          slurp:
            src: "{{ django_path }}/.db_recover_target"
          register: db_recover_target_content
          when: db_recover_target_file.stat.exists

        - name: Set recover targets (from file or default to latest)
          set_fact:
            db_recover_target: "{{ (db_recover_target_content['content'] | b64decode | trim).split(',')[0] | trim if db_recover_target_file.stat.exists else 'latest' }}"
            media_recover_target: "{{ (db_recover_target_content['content'] | b64decode | trim).split(',')[1] | trim if db_recover_target_file.stat.exists else 'latest' }}"

        - name: Display recover targets
          debug:
            msg: "Using recover targets - db: {{ db_recover_target }}, media: {{ media_recover_target }}"

        - name: Back up feedbacks and short links before recovery
          shell:
            cmd: "{{ project_slug }}-ctl safe_recovery backup"

        - name: Load database and media
          shell:
            cmd: "{{ project_slug }}-ctl backup_db recover_db_and_media {{ db_recover_target }} {{ media_recover_target }}"

        - name: Check the restored database has its migration history
          community.postgresql.postgresql_query:
            db: "{{ database_name }}"
            query: "SELECT count(*) AS applied FROM django_migrations"
          become: true
          become_user: postgres
          register: restored_migrations
          failed_when: >
            (restored_migrations.query_result | default([{'applied': 0}]))[0].applied | int == 0

        - name: Run migrations on the restored database
          ansible.builtin.command:
            cmd: "{{ project_slug }}-ctl migrate"
          become: true

        - name: Restore feedbacks and short links after recovery
          shell:
            cmd: "{{ project_slug }}-ctl safe_recovery restore"

        - name: Remove test fixtures (Villard-de-Lans) from restored database
          shell:
            cmd: "{{ project_slug }}-ctl delete_test_data"

        # Purge caches only once the data is final: the API keeps serving during
        # the recovery, so purging earlier lets stale or partial responses back in.
        - name: Clear Django cache
          shell:
            cmd: "{{ project_slug }}-ctl clear_cache"

        - name: Clear nginx API cache
          shell:
            cmd: "find /var/cache/nginx/api -mindepth 1 -delete"
          become: true

      when: dedicated_database and (clonecode.changed or force_update is defined)

    - name: Import WFS and WMS requests from the nginx logs into Matomo every night
      vars:
        matomo_log_importer_path: "{{ project_dir }}/matomo-log-analytics"
        matomo_auth_config_path: "/etc/{{ organization_slug }}/{{ project_slug }}/matomo-auth.ini"
      block:
        - name: Clone the Matomo log importer
          git:
            repo: https://github.com/matomo-org/matomo-log-analytics.git
            dest: "{{ matomo_log_importer_path }}"
            version: 4aaaf4c4be7a14231b5a40b7fbd50b67b5ae8697

        - name: Write the Matomo token
          copy:
            content: "[auth]\ntoken_auth={{ vault_matomo_token_auth }}\n"
            dest: "{{ matomo_auth_config_path }}"
            owner: root
            group: root
            mode: "0600"

        - name: Install the Matomo import script
          template:
            src: templates/matomo-log-import.sh.j2
            dest: "/usr/local/bin/{{ project_slug }}-matomo-log-import"
            owner: root
            group: root
            mode: "0700"

        - name: Schedule the Matomo import
          cron:
            name: "{{ project_slug }} matomo log import"
            user: root
            hour: "3"
            minute: "0"
            job: "/usr/local/bin/{{ project_slug }}-matomo-log-import >> {{ django_path }}/logs/matomo_import.log 2>&1"
      when: "'prod' in group_names"
